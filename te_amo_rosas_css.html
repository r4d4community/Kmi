<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Te amo, mi niña — (Rosas CSS)</title>
  <style>
    :root{
      --bg:#FFF5F7;
      --accent:#ff6b9a;
      --muted:#6b6b6b;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background: radial-gradient(circle at 10% 10%, #fff0f4, var(--bg));color:#222;overflow:hidden;}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px;position:relative;}
    .card{width:100%;max-width:780px;border-radius:18px;padding:28px;text-align:center;box-shadow:0 10px 30px rgba(17,17,17,0.08);background:linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.98));position:relative;z-index:1;}
    h1{color:var(--accent);font-size:2.4rem;margin:0;font-family:Georgia, 'Times New Roman', serif;}
    h2{color:#444;margin-top:8px;font-weight:400;}
    .heart{font-size:3.5rem;margin:18px 0;animation:beat 1.2s infinite;}
    @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
    p{font-size:1.05rem;color:#333;margin-top:14px;}
    /* Falling emojis (rosas) */
    .rosas{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
    .rosa{position:absolute;left:50%;top:-10%;font-size:28px;opacity:0;transform:translateX(-50%);animation:caer 8s linear infinite;}
    @keyframes caer{
      0%{transform:translateY(-20vh) translateX(0) rotate(0deg);opacity:0;filter:blur(0px);}
      10%{opacity:1;}
      100%{transform:translateY(120vh) translateX(40vw) rotate(360deg);opacity:0;filter:blur(0.3px);}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="rosas" id="rosas-emoji"></div>
    <div class="card">
      <h1>Te amo, mi niña</h1>
      <h2>Camila ❤️</h2>
      <div class="heart">💖</div>
      <p>Eres mi razón, mi calma y mi todo. No hay un solo día en que no agradezca tenerte en mi vida.</p>
    </div>
  </div>
  <script>
    // Create falling rose emojis (no external images)
    const cont = document.getElementById('rosas-emoji');
    function crearEmoji(){
      const el = document.createElement('div');
      el.className = 'rosa';
      el.textContent = '🌹';
      el.style.left = Math.random()*100 + '%';
      el.style.fontSize = (18 + Math.random()*28) + 'px';
      el.style.animationDuration = (6 + Math.random()*6) + 's';
      el.style.opacity = 0.6 + Math.random()*0.4;
      el.style.transform = 'translateX(0)';
      cont.appendChild(el);
      setTimeout(()=> el.remove(), 14000);
    }
    setInterval(crearEmoji, 400);
  </script>
</body>
</html>
