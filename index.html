<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Te amo, mi niña</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#FFF5F7;
      --card:#ffffff;
      --accent:#ff6b9a;
      --accent-2:#ffb3c6;
      --muted:#6b6b6b;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;background: radial-gradient(circle at 10% 10%, #fff0f4, var(--bg));color:#222;overflow:hidden;}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px;position:relative;}

    .card{
      width:100%;max-width:780px;border-radius:18px;padding:28px;text-align:center;box-shadow:0 10px 30px rgba(17,17,17,0.08);background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.95));backdrop-filter: blur(6px);position:relative;z-index:1;
    }

    h1{
      font-family:'Playfair Display',serif;
      color:var(--accent);
      font-size:2.5rem;
      margin:0;
    }
    h2{
      color:#444;
      font-weight:400;
      margin-top:10px;
    }
    .heart{
      font-size:4rem;
      margin:20px 0;
      animation:beat 1.2s infinite;
    }
    @keyframes beat{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.2)}
    }
    p{
      font-size:1.1rem;
      color:#333;
      margin-top:20px;
    }

    /* Rosas animadas */
    .rosas{
      position:absolute;
      top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none;
    }
    .rosa{
      position:absolute;
      width:40px;height:40px;
      background-image:url('https://cdn-icons-png.flaticon.com/512/616/616408.png');
      background-size:contain;
      background-repeat:no-repeat;
      opacity:0.9;
      animation:caer 10s linear infinite;
    }

    @keyframes caer{
      0%{transform:translateY(-10vh) rotate(0deg);opacity:0;}
      10%{opacity:1;}
      100%{transform:translateY(110vh) rotate(360deg);opacity:0;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="rosas" id="rosas"></div>
    <div class="card">
      <h1>Te amo, mi niña</h1>
      <h2>Camila ❤️</h2>
      <div class="heart">💖</div>
      <p>Eres mi razón, mi calma y mi todo. No hay un solo día en que no agradezca tenerte en mi vida.</p>
    </div>
  </div>
  <script>
    const contenedor = document.getElementById('rosas');
    function crearRosa(){
      const rosa = document.createElement('div');
      rosa.classList.add('rosa');
      rosa.style.left = Math.random()*100+'%';
      rosa.style.animationDuration = 6 + Math.random()*6 + 's';
      rosa.style.opacity = 0.7 + Math.random()*0.3;
      rosa.style.transform = `scale(${0.6 + Math.random()*0.6})`;
      contenedor.appendChild(rosa);
      setTimeout(()=>rosa.remove(),12000);
    }
    setInterval(crearRosa,700);
  </script>
</body>
</html>
